[project]
name = "indep-test-mrpt"
version = "0.1.0"
description = "Rank-based multi-resolution Pearson independence test (MRPT)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "hyppo==0.5.2",
    "matplotlib==3.10.1",
    "numpy==2.2.4",
    "scipy==1.15.2",
    "typer==0.24.1",
]
authors=[
    {name = "Pedro Urrego-Gomez", email = "pedrurrego@hotmail.com"},
    {name = "Santiago Ortiz", email = "saortizar@unal.edu.co"},
]

[dependency-groups]
dev = [
    "ruff==0.15.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
